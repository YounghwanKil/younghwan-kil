title: Younghwan Kil (길영환)
description: >-
  Younghwan Kil — M.S. student and researcher at KAIST AI. Research in
  trustworthy AI, generative-model safety, and uncertainty-aware clinical AI.
author: Younghwan Kil
openreview_url: "https://openreview.net/profile?id=~Younghwan_Kil1"
lang: en

# --- theme (installed as a gem; see Gemfile) ---
theme: just-the-docs
url: "https://younghwankil.github.io"
baseurl: "/younghwan-kil"

plugins:
  - jekyll-seo-tag

# --- just-the-docs options ---
color_scheme: light
search_enabled: true
search:
  heading_level: 3
  previews: 3
heading_anchors: true

aux_links:
  "GitHub":
    - "https://github.com/YounghwanKil"
aux_links_new_tab: true

footer_content: >-
  Younghwan Kil · yhgil99@snu.ac.kr · Maintained as a living wiki.

# Pretty URLs (/wiki/profile/ instead of /wiki/profile.html)
permalink: pretty

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - DESIGN.md
  - credentials
  - .omx
  - .omc
  - tests
  - scripts
